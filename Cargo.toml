[workspace]
members = ["crates/shar-core", "crates/shar-server", "crates/shar-widget-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/shar-project/shar"

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["hazmat"] }
hmac = "0.12.1"
rand_core = "0.6.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
subtle = "2.6.1"
voprf = { version = "0.5.0", default-features = false, features = ["ristretto255-ciphersuite", "serde"] }
