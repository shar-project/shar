apiVersion: v1
kind: ConfigMap
metadata:
  name: shar
data:
  SHAR_ALLOWED_ORIGINS: https://app.example
  SHAR_LISTEN: 0.0.0.0:8080
  SHAR_TRUSTED_PROXY_CIDRS: 10.0.0.0/8
  SHAR_ASSURANCE_MODE: "off"
  SHAR_REQUEST_LOG: "1"
  SHAR_MAX_CONCURRENT_REQUESTS: "256"
  SHAR_STATE_TIMEOUT_MS: "5000"
  SHAR_REQUEST_BODY_TIMEOUT_MS: "15000"
  SHAR_SHUTDOWN_TIMEOUT_MS: "25000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shar
  labels:
    app.kubernetes.io/name: shar
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shar
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shar
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-key-file
          # Keep this digest identical to the application image below.
          image: ghcr.io/example/shar-rust:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - >-
              set -eu;
              cp /input/shar-keys.json /output/shar-keys.json;
              chmod 0400 /output/shar-keys.json;
              chown 10001:10001 /output/shar-keys.json
          volumeMounts:
            - name: shar-keys-source
              mountPath: /input
              readOnly: true
            - name: shar-keys
              mountPath: /output
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
      containers:
        - name: shar
          # Replace with an immutable digest from a verified Shar release.
          image: ghcr.io/example/shar-rust:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: shar
          env:
            - name: SHAR_KEY_FILE
              value: /run/secrets/shar/shar-keys.json
            - name: SHAR_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: shar-state
                  key: postgres-url
            - name: SHAR_POSTGRES_CA_FILE
              value: /run/secrets/postgres/ca.pem
            - name: SHAR_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: shar-state
                  key: redis-url
          volumeMounts:
            - name: shar-keys
              mountPath: /run/secrets/shar
              readOnly: true
            - name: postgres-ca
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: shar-keys-source
          secret:
            secretName: shar-keys
            defaultMode: 0400
        - name: shar-keys
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: postgres-ca
          secret:
            secretName: shar-postgres-ca
            # The CA certificate is public material and must be readable by
            # the non-root process; private database credentials stay in env.
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shar
  labels:
    app.kubernetes.io/name: shar
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shar
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shar
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shar
